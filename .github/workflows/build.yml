name: SonarQube
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
      SFML_INSTALL_DIR: C:/Program Files (x86)/SFML
    steps:
      # 1
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # 2
      - name: Cache SFML
        uses: actions/cache@v3
        with:
          path: C:/Program Files (x86)/SFML
          key: SFML-3.0.2-${{ runner.os }}-v1
          restore-keys: |
            SFML-3.0.2-${{ runner.os }}-
      # 3
      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      # 4
      - name: Install SFML
        if: steps.cache-sfml.outputs.cache-hit != 'true'
        env:
          SFML_TOKEN: ${{ secrets.SFML_TOKEN }}
        run: |
          mkdir "C:/Program Files (x86)/SFML"
          curl -L -H "Authorization: token $SFML_TOKEN" -o sfml.zip https://github.com/Myrrhe/sfml-myrrhe/raw/main/sfml.zip
          powershell -Command "
            if (-not (Test-Path 'sfml.zip')) { throw 'sfml.zip not downloaded' }
            try {
              Expand-Archive -LiteralPath sfml.zip -DestinationPath 'C:/Program Files (x86)/SFML' -Force
            } catch {
              Write-Error 'SFML archive is invalid or corrupted.'
              exit 1
            }
          "
      # 5
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6

      # 6
      - name: Configure CMake (MingGW)
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH" which cmake || { echo "cmake not found"; exit 1; } cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release

      # 7
      #- name: Install MinGW
      #  uses: msys2/setup-msys2@v2
      #  with:
      #    update: true
      #    install: >-
      #      mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-cmake


      # 6
      #- name: Configure CMake (MingGW)
      #  shell: msys2 {0}
      #  run: |
      #    cmake -S . -B build \
      #      -G "MinGW Makefiles" \
      #      -DCMAKE_BUILD_TYPE=Release

      # 7
      - name: Run Build Wrapper
        shell: msys2 {0}
        run: |
          build-wrapper-win-x86-64.exe --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build --config Release
      # 8
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define "sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json"
